<title>Mosselbaai Scorecard Template</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; background: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { width: 100%; max-width: 420px; margin: 8px auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; border: 1px solid #d1d5db; font-size: 11px; }
  .row { display: flex; }
  .cell { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #e5e7eb; padding: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fixed-col { flex: 0 0 8%; max-width: 8%; }
  .split { flex: 1 1 0; display: flex; padding: 0; }
  .split .gr { flex: 7 1 0; border: 1px solid #e5e7eb; }
  .split .pt { flex: 3 1 0; border: 1px solid #e5e7eb; }
  .h9 { height: 36px; }
  .h6 { height: 24px; }
  .h7 { height: 28px; }
  .h8 { height: 32px; }
  .bold { font-weight: 700; }
  .semibold { font-weight: 600; }
  .white-bg { background: #fff; }
  .gray-bg { background: #e5e7eb; }
  .pink-bg { background: #fce7f3; }
  .gold-bg { background: #d4a017; color: #fff; }
  .yellow-bg { background: #ffd700; }
  .blue-bg { background: #4a90d9; color: #fff; }
  .red-bg { background: #fef2f2; }
  .red-text { color: #dc2626; }
  .divider { height: 4px; background: #1b4332; }
</style>
</head>
